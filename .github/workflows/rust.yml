name: Rust-Boy quality gates

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: Validate source and module manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline manifest validation
        run: |
          python3 tools/validate_catalog.py
          python3 tools/validate_roles.py
          python3 tools/validate_rust_version.py

  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    # The checked-in rust-toolchain.toml selects stable; override that here
    # so the exact MSRV job genuinely compiles with its requested toolchain.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["stable", "1.90.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Install matrix Rust toolchain
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component rustfmt --component clippy
          rustup default "${{ matrix.toolchain }}"
          rustc --version
          cargo --version
      - name: Assert active matrix compiler
        run: |
          current="$(rustup show active-toolchain)"
          case "$current" in
            "${{ matrix.toolchain }}"-*) ;;
            *) printf 'Wrong toolchain: %s\n' "$current"; exit 1 ;;
          esac
          if [ "${{ matrix.toolchain }}" = "1.90.0" ]; then
            rustc --version | grep -Eq '^rustc 1\.90\.0 '
          fi
      - name: Formatting
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - name: Install JavaScript test runtime
        if: matrix.toolchain == 'stable'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dashboard JavaScript and native RustGIS map tests
        if: matrix.toolchain == 'stable'
        run: |
          node --check crates/pipboy/assets/reclamation.js
          node --check crates/pipboy/assets/network.js
          node tools/test_network_ui.cjs
          node --check crates/pipboy/assets/dashboard.js
          node --check crates/pipboy/assets/micro.js
          node --check crates/pipboy/assets/tasks.js
          node --check crates/pipboy/assets/map.js
          node --check crates/pipboy/assets/map-import.js
          node --check crates/pipboy/assets/map-online.js
          node tools/test_rustgis_map_import.cjs
          node tools/test_rustgis_map_view.cjs
          node tools/test_rustgis_online.cjs
          node tools/test_rustgis_online_view.cjs
      - name: Compile all targets
        run: cargo check --workspace --all-targets --locked
      - name: Unit tests
        run: cargo test --workspace --locked
      - name: Clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Runtime CLI and terminal smoke checks
        if: matrix.toolchain == 'stable'
        run: |
          cargo build --workspace --locked
          python3 tools/smoke_runtime.py
          python3 tools/smoke_notes.py
          python3 tools/smoke_permissions.py
          python3 tools/smoke_simulator.py
          python3 tools/smoke_replay.py
          python3 tools/smoke_transport.py
          python3 tools/smoke_mock_adapters.py
          python3 tools/smoke_native_cli.py
          python3 tools/smoke_broker.py
          python3 tools/smoke_game.py
          python3 tools/smoke_workbench.py
          python3 tools/smoke_network.py
          python3 tools/smoke_network_health.py
          python3 tools/smoke_scout.py
          python3 tools/smoke_dashboard.py
          python3 tools/smoke_micro.py
          python3 tools/smoke_tasks.py
          python3 tools/smoke_peer.py

  native:
    name: Native ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: python3
          - os: windows-latest
            python: python
    steps:
      - uses: actions/checkout@v4
      - name: Install native Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Compile, unit test and build
        shell: bash
        run: |
          cargo check --workspace --all-targets --locked
          cargo test --workspace --locked
          cargo build --workspace --locked
      - name: Offline preferences and virtual-device smoke
        shell: bash
        run: |
          ${{ matrix.python }} tools/smoke_permissions.py
          ${{ matrix.python }} tools/smoke_simulator.py
          ${{ matrix.python }} tools/smoke_replay.py
          ${{ matrix.python }} tools/smoke_transport.py
          ${{ matrix.python }} tools/smoke_mock_adapters.py
          ${{ matrix.python }} tools/smoke_native_cli.py
          ${{ matrix.python }} tools/smoke_broker.py
          ${{ matrix.python }} tools/smoke_game.py
          ${{ matrix.python }} tools/smoke_workbench.py
          ${{ matrix.python }} tools/smoke_network.py
          ${{ matrix.python }} tools/smoke_network_health.py
          ${{ matrix.python }} tools/smoke_scout.py
          ${{ matrix.python }} tools/smoke_dashboard.py
          ${{ matrix.python }} tools/smoke_micro.py
          ${{ matrix.python }} tools/smoke_tasks.py
          ${{ matrix.python }} tools/smoke_peer.py
      - name: Native macOS terminal PTY journey
        if: matrix.os == 'macos-latest'
        shell: bash
        run: python3 tools/smoke_runtime.py
      - name: Native Windows ConPTY terminal journey
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: python tools/smoke_windows_conpty.py
