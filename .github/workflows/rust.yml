name: Rust-Boy quality gates

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: Validate source and module manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline manifest validation
        run: python3 tools/validate_catalog.py

  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["stable", "1.81.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check
      - name: Compile all targets
        run: cargo check --workspace --all-targets --locked
      - name: Unit tests
        run: cargo test --workspace --locked
      - name: Clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Runtime CLI and terminal smoke checks
        if: matrix.toolchain == 'stable'
        run: |
          cargo build -p pipboy --locked
          python3 tools/smoke_runtime.py
          python3 tools/smoke_notes.py
          python3 tools/smoke_permissions.py
          python3 tools/smoke_simulator.py
