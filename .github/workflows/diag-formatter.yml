name: Temporary DIAG branch formatter

on:
  push:
    branches: ["feat/diag-offline-ingestion"]
    paths:
      - "crates/**/src/*.rs"
      - ".github/workflows/diag-formatter.yml"

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.ref == 'refs/heads/feat/diag-offline-ingestion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Install Rust formatter
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - name: Format only this working feature branch
        env:
          RUSTUP_TOOLCHAIN: 1.90.0
        run: |
          cargo fmt --all
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- crates/pipboy-core/src crates/pipboy/src
            git commit -m "style: apply rustfmt to DIAG and NET ENGINEER working branch"
            git push origin HEAD:feat/diag-offline-ingestion
          fi
