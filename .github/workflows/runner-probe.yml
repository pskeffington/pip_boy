name: Rust-Boy runner admission probe

on:
  push:
    branches:
      - feat/rust-native-foundation
    paths:
      - .github/workflows/runner-probe.yml

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify runner job and checkout
        run: |
          echo "Rust-Boy runner probe started"
          test -f Cargo.toml
