name: Rust-Boy runner admission probe

on:
  push:
    branches:
      - feat/rust-native-foundation
    paths:
      - .github/workflows/runner-probe.yml

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Verify runner, checkout and Rust
        run: |
          test -f Cargo.toml
          rustc --version
          cargo --version
