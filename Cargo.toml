[workspace]
members = ["crates/pipboy-core", "crates/pipboy", "crates/rust-boy-broker", "crates/rust-boy-adapter-sdk"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pskeffington/pip_boy"
rust-version = "1.90"

[workspace.dependencies]
rust-radio = { git = "https://github.com/pskeffington/rust_radio", rev = "3d77d11da3a31fbc3144635da6d391a3febf38b7", default-features = false }
