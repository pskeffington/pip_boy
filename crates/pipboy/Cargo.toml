[package]
name = "pipboy"
description = "Rust-Boy: offline-first native terminal UI and command-line field console"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pipboy-core = { path = "../pipboy-core" }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
serde_json = "1.0"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
cpal = "=0.16.0"
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3", "aac"] }
ringbuf = "=0.4.8"

