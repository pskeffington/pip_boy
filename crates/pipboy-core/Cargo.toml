[package]
name = "pipboy-core"
description = "Offline-first telemetry, notes, and module core for Rust-Boy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rust-radio = { workspace = true, features = ["sdr"] }
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ring = "0.17.14"
sysinfo = "0.33"
tempfile = "3"

age = { version = "0.12.1", default-features = false }
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
